---
name: stale

on:
  schedule:
    # Run weekly on Saturdays
    - cron: "30 1 * * 6"
  # Run the workflow manually
  workflow_dispatch:

# Declare default permissions as read-only
permissions: read-all

jobs:
  # The template calls cisco-ospo/.github's reusable workflow, which this organization's allowed-actions policy
  # does not permit, so actions/stale runs directly with the same settings.
  mark-stale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "keep"
          exempt-pr-labels: "keep"
